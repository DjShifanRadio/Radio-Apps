<style>
:root {
    --primary: #00eaff;
    --secondary: #ff00c8;
    --bg: #0a0f1e;
    --card-bg: rgba(255, 255, 255, 0.04);
    --neon-glow: 0 0 20px rgba(0, 234, 255, 0.6), 0 0 40px rgba(255, 0, 200, 0.4);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: var(--bg);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 120px;
}

#galaxy {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: radial-gradient(circle at center, #141b34 0%, #0a0f1e 100%);
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.card {
    background: var(--card-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 30px;
    padding: 40px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 30px;
    padding: 2px;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
    background-size: 200% auto;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: neonMove 6s linear infinite;
    pointer-events: none;
}

@keyframes neonMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

.flex {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
}

.left {
    flex: 1;
    text-align: center;
}

.logo-container {
    position: relative;
    display: inline-block;
    margin-bottom: 15px;
}

.logo {
    width: 160px;
    height: 160px;
    border-radius: 25%;
    border: 3px solid var(--secondary);
    box-shadow: var(--neon-glow);
    animation: float 4s infinite ease-in-out;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
}

h1 {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(45deg, #fff, #b3f6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.tag {
    opacity: 0.8;
    margin: 10px 0 25px;
    font-size: 1.1rem;
    color: #e0e0e0;
}

.btn-group {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
}

.btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 40px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    border: none;
}

.btn-primary {
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    box-shadow: 0 4px 15px rgba(0, 234, 255, 0.3);
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: var(--neon-glow);
}

.btn-pwa {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: none;
}

.btn-pwa:hover {
    background: white;
    color: var(--bg);
    transform: translateY(-3px);
}

.phone {
    width: 260px;
    aspect-ratio: 9/16;
    border-radius: 30px;
    overflow: hidden;
    border: 4px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.slides {
    display: flex;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.slides img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 0, 0, 0.15);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255, 0, 0, 0.3);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1px;
}

.live-dot {
    width: 8px;
    height: 8px;
    background: #ff3b30;
    border-radius: 50%;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { transform: scale(0.9); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.4; }
    100% { transform: scale(0.9); opacity: 1; }
}

.listeners {
    font-size: 0.9rem;
    opacity: 0.8;
    margin-top: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.player {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: rgba(10, 15, 30, 0.85);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    padding: 0 30px;
    z-index: 999;
}

.player-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.song-details {
    max-width: 200px;
}

#song-title {
    font-size: 0.95rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.station-name {
    font-size: 0.8rem;
    opacity: 0.6;
}

.fav-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.2s, color 0.2s;
}

.fav-btn.active {
    color: var(--secondary);
    animation: heartBeat 0.3s ease-in-out;
}

@keyframes heartBeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

.player-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.play-btn {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: none;
    background: white;
    color: var(--bg);
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.play-btn:hover {
    transform: scale(1.08);
    background: var(--primary);
    color: white;
    box-shadow: 0 0 15px var(--primary);
}

.spotify-eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 18px;
}

.eq-bar {
    width: 3px;
    height: 3px;
    background: var(--primary);
    border-radius: 2px;
    transition: height 0.1s ease;
}

.player-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
}

.volume-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
}

.volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
}

@media (max-width: 900px) {
    .flex { flex-direction: column; gap: 30px; }
    .card { padding: 30px 20px; }
    .phone { width: 220px; }
    .player { grid-template-columns: 1fr auto; padding: 0 20px; height: 90px; }
    .player-right { display: none; }
}
</style>
</head>

<body>

<canvas id="galaxy"></canvas>

<div class="container">
    <div class="card">
        <div class="flex">
            <div class="left">
                <div class="logo-container">
                    <img src="https://www.appcreator24.com/srv/imgs/gen/4110939_ico.png?v=3" class="logo" alt="RJ Aadhavan">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <span class="status-badge"><span class="live-dot"></span> நேரலை (LIVE)</span>
                    <div class="listeners"><i class="fa-solid fa-headphones"></i> <span id="listener-count">48</span> கேப்பாளர்கள்</div>
                </div>

                <h1>RJ AADHAVAN</h1>
                <p class="tag">“தமிழ் பேசும் மக்களின் உயிர் நாடி”</p>

                <div class="btn-group">
                    <a href="https://apk.e-droid.net/apk/app4110939-l94a0s.apk?v=3" class="btn btn-primary">
                        <i class="fa-solid fa-download"></i> Download Android App
                    </a>
                    <button class="btn btn-pwa" id="pwaBtn">
                        <i class="fa-solid fa-mobile-screen-button"></i> Install Web App
                    </button>
                </div>
            </div>

            <div class="phone">
                <div class="slides" id="slides">
                    <img src="01.jpg" alt="Slide 1">
                    <img src="02.png" alt="Slide 2">
                    <img src="03.png" alt="Slide 3">
                    <img src="04.png" alt="Slide 4">
                    <img src="05.png" alt="Slide 5">
                    <img src="06.png" alt="Slide 6">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="player">
    <div class="player-left">
        <div class="song-details">
            <div id="song-title">இணைக்கிறது...</div>
            <div class="station-name">RJ Aadhavan Radio</div>
        </div>
        <button class="fav-btn" onclick="toggleFav()" id="favBtn">
            <i class="fa-solid fa-heart"></i>
        </button>
    </div>

    <div class="player-center">
        <button class="play-btn" onclick="toggleRadio()" id="mainPlayBtn">
            <i class="fa-solid fa-play"></i>
        </button>
        
        <div class="spotify-eq" id="eqContainer">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
        </div>
    </div>

    <div class="player-right">
        <div class="volume-container">
            <i class="fa-solid fa-volume-high" style="opacity:0.7" id="volIcon"></i>
            <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="0.8" id="volume">
        </div>
    </div>
</div>

<!-- புதிய 100% பாதுகாப்பான HTTPS ஆடியோ ஸ்ட்ரீம் -->
<audio id="radio" src="https://gtr-unicast2u.radioca.st/stream" preload="true"></audio>

<script>
// 🌌 விண்மீன் பின்னணி அனிமேஷன்
const canvas = document.getElementById("galaxy");
const ctx = canvas.getContext("2d");
let stars = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
}

function initStars() {
    stars = [];
    const count = window.innerWidth < 600 ? 80 : 180;
    for (let i = 0; i < count; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            speedX: (Math.random() - 0.5) * 0.2,
            speedY: (Math.random() - 0.5) * 0.2,
            opacity: Math.random()
        });
    }
}

function animateGalaxy() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
        ctx.fillRect(star.x, star.y, star.size, star.size);
        star.x += star.speedX;
        star.y += star.speedY;
        if (star.x < 0 || star.x > canvas.width) star.speedX *= -1;
        if (star.y < 0 || star.y > canvas.height) star.speedY *= -1;
    });
    requestAnimationFrame(animateGalaxy);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
animateGalaxy();

// 📱 ஸ்லைடர்
let slideIdx = 0;
const slides = document.getElementById("slides");
setInterval(() => {
    slideIdx = (slideIdx + 1) % 6;
    slides.style.transform = `translateX(-${slideIdx * 100}%)`;
}, 4000);

/* 🎙️ பாடல் விபரங்கள் மற்றும் நேரடி கேட்போர் எண்ணிக்கை எடுக்கும் முறை */
const statsUrl = "https://gtr-unicast2u.radioca.st/stats?sid=1&json=1";
function updateRadioStats() {
    fetch(statsUrl)
        .then(response => response.json())
        .then(data => {
            // பாடல் தலைப்பை அப்டேட் செய்தல்
            if (data.songtitle && data.songtitle.trim() !== "") {
                document.getElementById("song-title").innerText = data.songtitle;
            } else {
                document.getElementById("song-title").innerText = "RJ Aadhavan Hits";
            }
            // உண்மையான நேரடி கேட்போர் எண்ணிக்கை
            if (data.uniquevisitors !== undefined) {
                document.getElementById("listener-count").innerText = data.uniquevisitors;
            }
        })
        .catch(() => {
            document.getElementById("song-title").innerText = "RJ Aadhavan Hits";
        });
}
setInterval(updateRadioStats, 12000);
updateRadioStats();

/* 🎵 ஸ்பாட்டிஃபை ஈக்வலைசர் மற்றும் ஆடியோ கன்ட்ரோல் */
const radio = document.getElementById("radio");
const playBtn = document.getElementById("mainPlayBtn");
const volSlider = document.getElementById("volume");
const eqBars = document.querySelectorAll(".eq-bar");

let audioCtx, analyser, dataArray, source;
let isEqSetup = false;

function setupEqualizer() {
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        
        radio.crossOrigin = "anonymous";
        source = audioCtx.createMediaElementSource(radio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        analyser.fftSize = 32;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isEqSetup = true;
    } catch(e) {
        console.log("Visualizer dynamic bypass active.");
    }
}

function renderSpotifyEq() {
    if (!radio.paused) {
        requestAnimationFrame(renderSpotifyEq);
        if (isEqSetup && analyser) {
            analyser.getByteFrequencyData(dataArray);
            eqBars.forEach((bar, index) => {
                let val = dataArray[index * 2] || 0;
                let height = 3 + (val / 255) * 19;
                bar.style.height = `${height}px`;
            });
        } else {
            // ஃபால்பேக் அனிமேஷன் (CORS கட்டுப்பாடு இருந்தால்)
            eqBars.forEach(bar => {
                bar.style.height = `${Math.floor(Math.random() * 15) + 4}px`;
            });
        }
    } else {
        eqBars.forEach(bar => bar.style.height = '3px');
    }
}

function toggleRadio() {
    if (radio.paused) {
        radio.src = "https://gtr-unicast2u.radioca.st/stream";
        let playPromise = radio.play();
        
        if (playPromise !== undefined) {
            playPromise.then(() => {
                playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
                if (!isEqSetup) setupEqualizer();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                renderSpotifyEq();
            }).catch(error => {
                radio.removeAttribute("crossOrigin");
                radio.play();
                playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
                renderSpotifyEq();
            });
        }
    } else {
        radio.pause();
        radio.src = ""; 
        playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
    }
}

volSlider.addEventListener('input', (e) => {
    radio.volume = e.target.value;
    const icon = document.getElementById("volIcon");
    if (e.target.value == 0) {
        icon.className = "fa-solid fa-volume-xmark";
    } else if (e.target.value < 0.5) {
        icon.className = "fa-solid fa-volume-low";
    } else {
        icon.className = "fa-solid fa-volume-high";
    }
});

function toggleFav() {
    document.getElementById("favBtn").classList.toggle("active");
}

let deferredPrompt;
const pwaBtn = document.getElementById('pwaBtn');
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    pwaBtn.style.display = 'inline-flex';
});
pwaBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') pwaBtn.style.display = 'none';
        deferredPrompt = null;
    }
});
</script>
</body>
</html>
